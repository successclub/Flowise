<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PIROCKET Orbit Crest</title>
  <desc id="desc">Icon highlighting the orbital energy of PIROCKET with a stylized P and motion trail.</desc>
