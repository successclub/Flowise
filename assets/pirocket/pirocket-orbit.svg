      <stop offset="0%" stop-color="#2b1b5a" />
      <stop offset="55%" stop-color="#43218f" />
      <stop offset="100%" stop-color="#5c28c6" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="50%" x2="100%" y2="50%">
